<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X-Opto Lab 课题组模拟器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="mobile-device-wrapper">
<div class="mobile-game-screen">

    <!-- ==================== 顶部状态栏 ==================== -->
    <header class="top-bar">
        <div class="top-bar-row1">
            <div class="lab-badge">
                <span class="lab-icon">🔬</span>
                <div>
                    <div id="lab-name" class="lab-name">X-Opto 课题组</div>
                    <div id="lab-grade" class="lab-grade-tag">F · 初创小隔间</div>
                </div>
            </div>
            <div class="top-resources">
                <div class="top-res-pill res-funding">
                    <span>💵</span><span id="stat-funding">15.0</span><small>万</small>
                </div>
                <div class="top-res-pill res-prestige">
                    <span>💎</span><span id="stat-prestige">0</span>
                </div>
            </div>
        </div>
        <div class="top-bar-row2">
            <span class="time-display">⏰ <span id="stat-time">第1年 9月 上旬</span></span>
            <div class="top-controls">
                <button id="btn-sound" class="ctrl-btn" onclick="window.soundEngine.toggleMute()" title="音效开关">🔊</button>
                <button id="btn-speed" class="ctrl-btn" onclick="window.ui.toggleSpeed()">⚡ x1</button>
                <button class="ctrl-btn" onclick="window.ui.openAchievement()" title="课题组成就">🏆</button>
                <button class="ctrl-btn" onclick="window.ui.openModal('modal-log')" title="纪实日志">📜</button>
                <button class="ctrl-btn" onclick="window.ui.openModal('modal-settings')" title="设置与口令">⚙️</button>
            </div>
        </div>
    </header>

    <!-- ==================== 常驻资源面板 ==================== -->
    <div class="resource-panel" id="resource-panel">
        <!-- JS动态渲染7种资源 -->
    </div>

    <!-- ==================== Buff 状态条 ==================== -->
    <div class="buff-bar" id="buff-bar" style="display:none;"></div>

    <!-- ==================== 主线任务条 ==================== -->
    <div class="quest-bar" id="quest-bar"></div>

    <!-- ==================== 主内容区 ==================== -->
    <main class="main-scroll">
        <!-- 实验室视图 -->
        <div id="view-stations" class="content-view active">
            <div id="stations-list"></div>
            <button class="btn-goto-shop" onclick="window.ui.switchTab('shop')">🔨 购置新设备 →</button>
        </div>

        <!-- 人事视图 -->
        <div id="view-hr" class="content-view">
            <div id="hr-container"></div>
        </div>

        <!-- 立项视图 -->
        <div id="view-paper" class="content-view">
            <div id="paper-container"></div>
        </div>

        <!-- 设备商城视图 -->
        <div id="view-shop" class="content-view">
            <div id="shop-container"></div>
        </div>

        <!-- 人际网视图 -->
        <div id="view-network" class="content-view">
            <div id="network-container"></div>
        </div>
    </main>

    <!-- ==================== 底部导航 ==================== -->
    <footer class="bottom-nav">
        <button class="nav-btn active" data-tab="stations" onclick="window.ui.switchTab('stations')">
            <span>🏭</span><small>实验室</small>
        </button>
        <button class="nav-btn" data-tab="hr" onclick="window.ui.switchTab('hr')">
            <span>👥</span><small>人事</small>
        </button>
        <button class="nav-btn" data-tab="paper" onclick="window.ui.switchTab('paper')">
            <span>📝</span><small>立项</small>
        </button>
        <button class="nav-btn" data-tab="shop" onclick="window.ui.switchTab('shop')">
            <span>🛒</span><small>设备</small>
        </button>
        <button class="nav-btn" data-tab="network" onclick="window.ui.switchTab('network')">
            <span>🌐</span><small>人际网</small>
        </button>
    </footer>

    <!-- ==================== 弹窗区 ==================== -->

    <!-- 论文立项弹窗 -->
    <div id="modal-paper" class="modal-overlay" style="display:none;">
        <div class="modal-box modal-paper-box">
            <div class="modal-header">
                <h3>📝 论文立项</h3>
                <button class="btn-close" onclick="window.ui.closeModal('modal-paper')">✖</button>
            </div>
            <div class="modal-body" id="paper-modal-body"></div>
        </div>
    </div>

    <!-- 操作员选择弹窗 -->
    <div id="modal-assign" class="modal-overlay" style="display:none;">
        <div class="modal-box modal-assign-box">
            <div class="modal-header">
                <h3 id="assign-title">选择操作员</h3>
                <button class="btn-close" onclick="window.ui.closeModal('modal-assign')">✖</button>
            </div>
            <div class="modal-body" id="assign-modal-body"></div>
        </div>
    </div>

    <!-- 月报弹窗 -->
    <div id="modal-monthly" class="modal-overlay" style="display:none;">
        <div class="modal-box modal-monthly-box">
            <div class="modal-header">
                <h3 id="monthly-title">📋 月度报告</h3>
                <button class="btn-close" onclick="window.ui.closeModal('modal-monthly')">✖</button>
            </div>
            <div class="modal-body" id="monthly-body"></div>
        </div>
    </div>

    <!-- 消息日志弹窗 -->
    <div id="modal-log" class="modal-overlay" style="display:none;">
        <div class="modal-box modal-log-box">
            <div class="modal-header">
                <h3>📜 课题组纪实</h3>
                <button class="btn-close" onclick="window.ui.closeModal('modal-log')">✖</button>
            </div>
            <div class="modal-body" id="log-body"></div>
        </div>
    </div>

    <!-- 口令码弹窗 -->
    <div id="modal-redeem" class="modal-overlay" style="display:none;">
        <div class="modal-box modal-redeem-box">
            <div class="modal-header">
                <h3>🎁 口令码</h3>
                <button class="btn-close" onclick="window.ui.closeModal('modal-redeem')">✖</button>
            </div>
            <div class="modal-body">
                <p class="redeem-desc">输入口令码兑换资源：</p>
                <div class="redeem-input-row">
                    <input type="text" id="input-code" placeholder="如 WANGMENG666" class="redeem-input">
                    <button onclick="window.ui.doRedeem()" class="btn-redeem">兑换</button>
                </div>
                <p class="redeem-hint">彩蛋：WANGMENG666 · XOPTO888 · NATURE2026 · VASP666</p>
            </div>
        </div>
    </div>

    <!-- 成就弹窗 -->
    <div id="modal-achievement" class="modal-overlay" style="display:none;">
        <div class="modal-box modal-ach-box">
            <div class="modal-header">
                <h3>🏆 课题组成就</h3>
                <button class="btn-close" onclick="window.ui.closeModal('modal-achievement')">✖</button>
            </div>
            <div class="modal-body" id="achievement-body"></div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="modal-settings" class="modal-overlay" style="display:none;">
        <div class="modal-box modal-settings-box">
            <div class="modal-header">
                <h3>⚙️ 设置</h3>
                <button class="btn-close" onclick="window.ui.closeModal('modal-settings')">✖</button>
            </div>
            <div class="modal-body">
                <button class="btn-modal-action" onclick="window.gameEngine.saveGame(); window.ui.toast('✅ 存档成功');">💾 保存进度</button>
                <button class="btn-modal-action" onclick="window.ui.openModal('modal-log')">📜 查看纪实日志</button>
                <button class="btn-modal-action" onclick="window.ui.openModal('modal-redeem')">🎁 输入口令码</button>
                <button class="btn-modal-action btn-danger" onclick="if(confirm('确定重新建组？所有进度将清空！')) window.gameEngine.hardReset();">⚠️ 重新建组</button>
            </div>
        </div>
    </div>

    <!-- 非打断式成就解锁横幅 -->
    <div id="achievement-toast" class="achievement-toast"></div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

</div>
</div>

<script src="js/gameData.js"></script>
<script src="js/character.js"></script>
<script src="js/soundEngine.js"></script>
<script src="js/eventEngine.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
